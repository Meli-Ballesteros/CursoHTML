<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Más inputs</title>
</head>
<body>

    <!-- Apertura del formulario envuelve a todos los campos -->
    <form action="#" method="post">
        
        <div>
            <label for="password">Contraseña:</label>
            <input id="password" type="password" name="password">
        </div>

        <div>
            <label for="edad">Edad:</label>
            <input type="number" name="edad" id="edad" min="18" max="70">
        </div>

        <div>
            <label for="fecha">Fecha:</label>
            <input type="date" name="fecha" id="fecha">
        </div>

        <div>
            <label for="color">Color:</label>
            <input type="color" name="color" id="color">
        </div>

        <fieldset>
            <legend>Género</legend>
            <input type="radio" name="genero" id="masculino" value="M">
            <label for="masculino">Masculino</label>

            <input type="radio" name="genero" id="femenino" value="F">
            <label for="femenino">Femenino</label>
        </fieldset>

        <!-- Se arregló la apertura y cierre del fieldset de Intereses -->
        <fieldset>
            <legend>Intereses</legend>
            <input type="checkbox" name="intereses" id="deportes" value="deportes">
            <label for="deportes">Deportes</label>

            <input type="checkbox" name="intereses" id="musica" value="musica">
            <label for="musica">Música</label>
        </fieldset>

        <button type="submit">Enviar</button>

    </form> <!-- Cierre correcto del formulario -->

</body>
</html>
